<div #map class="h-[60vh] sm:h-[calc(100vh-64px)]"></div>

<section class="sm:fixed sm:w-65 max-h-70 h-[32vh] sm:h-auto overflow-y-auto sm:rounded sm:top-20 sm:l-10 sm:ml-4 bg-white p-5">
  <h2 class="text-xl font-bold mb-2">Marcadores</h2>
  <div class="flex flex-col gap-2">
    @for (marker of markers(); track marker.id) {
      <div
        class="form-control"
        (click)="flyToMarker(marker.mapboxMarker.getLngLat())"
        (dblclick)="deleteMarker(marker)"
      >
        <label class="label flex justify-between cursor-pointer w-full">
          <div>
            <span class="text-black text-xs font-semibold whitespace-pre">
              {{ marker.mapboxMarker.getLngLat() | json }}
            </span>
          </div>
          <input
            type="radio"
            name="radio-10"
            checked="checked"
            class="radio"
            [style]="{ backgroundColor: marker.mapboxMarker._color }"
          />
        </label>
      </div>
    } @empty {
      <div class="flex justify-center items-center bg-blue-100 rounded py-5">
        <p class="text-xs text-secondary">No hay marcadores.</p>
      </div>
    }
  </div>
</section>
